# Keycloak Configuration
# Utilisation de 127.0.0.1 au lieu de localhost pour éviter les problèmes WSL2 avec keep-alive
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:8080/realms/yansnet
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:8080/realms/yansnet/protocol/openid-connect/certs
# Keycloak Client Configuration
keycloak.server-url=http://127.0.0.1:8080
keycloak.realm=yansnet
